# ==============================================================================
# chathushka.xubi.org — reverse proxy for everything on the VPS
# ==============================================================================
#
# Layout:
#   /                        -> redirects to /secondbrain (the control panel
#                                is the front door now that n8n moved off root)
#   /n8n/                    -> n8n (moved off "/" — see the N8N_PATH note below)
#   /secondbrain/            -> the second-brain dashboard (Next.js, port 3001)
#   /job-tracker/            -> job-tracker-mcp's webhook (port 8090) — n8n's
#                                Job Search Matcher v3 posts job matches here
#   /agent/                  -> the orchestrator's webhook (port 8092) — the
#                                always-on front door to the agent itself
#
# n8n must be told about its new path too, or its own links/webhooks will
# still assume they live at the root. Add to n8n's environment (wherever
# n8n's docker run/compose/env file lives) and restart the container:
#
#   N8N_PATH=/n8n/
#   WEBHOOK_URL=https://chathushka.xubi.org/n8n/
#
# Without WEBHOOK_URL specifically, n8n's own webhook nodes (like the "Daily
# at 8am" schedule trigger, if it's ever swapped for a webhook trigger) will
# generate URLs pointing at the old root path.
#
# This file assumes the previous location block that proxied "/" straight to
# n8n has been REMOVED and replaced by what's below — don't just append this,
# or you'll have two location blocks fighting over "/".
# ==============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chathushka.xubi.org;

    # Keep whatever TLS cert config was already here (certbot / etc.) —
    # not reproduced here since it's specific to how the cert was issued.
    # ssl_certificate     /etc/letsencrypt/live/chathushka.xubi.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chathushka.xubi.org/privkey.pem;

    client_max_body_size 15m;  # resume uploads (.docx/.pdf) go through this

    # --- root: send people to the control panel -----------------------------
    location = / {
        return 302 /secondbrain;
    }

    # --- n8n, now under /n8n/ instead of the root ----------------------------
    location /n8n/ {
        proxy_pass http://127.0.0.1:5678/;   # adjust the port if yours differs
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # n8n's editor UI uses a persistent websocket connection for push updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # --- second-brain dashboard, under /secondbrain/ -------------------------
    # Built with NEXT_BASE_PATH=/secondbrain, so the app itself generates
    # correctly-prefixed asset/API/page URLs — this just needs to hand the
    # whole prefixed path straight through, unstripped.
    location /secondbrain/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- job-tracker-mcp webhook (n8n -> job_matches) ------------------------
    location /job-tracker/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- orchestrator webhook (the agent's always-on front door) -------------
    location /agent/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Planner calls (LLM round trip + an MCP tool call) can run longer
        # than Nginx's 60s default, especially under load on a 1-core VPS.
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chathushka.xubi.org;
    return 301 https://$host$request_uri;
}
