# ==============================================================================
# secondbrain.xubi.org — reverse proxy for everything on the VPS
# ==============================================================================
#
# Layout:
#   /                        -> redirects to /secondbrain (the control panel
#                                is the front door now that n8n moved off root)
#   /n8n/                    -> n8n (moved off "/" — see the N8N_PATH note below)
#   /secondbrain/            -> the second-brain dashboard (Next.js, port 3001)
#   /job-tracker/            -> job-tracker-mcp's webhook (port 8090) — n8n's
#                                Job Search Matcher v3 posts job matches here
#   /agent/                  -> the orchestrator's webhook (port 8092) — the
#                                always-on front door to the agent itself
#
# n8n environment configuration:
#   N8N_PATH=/n8n/
#   WEBHOOK_URL=https://secondbrain.xubi.org/n8n/
#   N8N_EDITOR_BASE_URL=https://secondbrain.xubi.org/n8n/
#   N8N_HOST=secondbrain.xubi.org
# ==============================================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name secondbrain.xubi.org chathushka.xubi.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://secondbrain.xubi.org$request_uri;
    }
}

# Redirect legacy domain chathushka.xubi.org HTTPS -> secondbrain.xubi.org HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chathushka.xubi.org;

    ssl_certificate     /etc/letsencrypt/live/chathushka.xubi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chathushka.xubi.org/privkey.pem;

    return 301 https://secondbrain.xubi.org$request_uri;
}

# Main server block for secondbrain.xubi.org
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name secondbrain.xubi.org;

    ssl_certificate     /etc/letsencrypt/live/secondbrain.xubi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secondbrain.xubi.org/privkey.pem;

    client_max_body_size 15m;  # resume uploads (.docx/.pdf) go through this

    # --- root: send people to the control panel -----------------------------
    location = / {
        return 302 /secondbrain;
    }

    # --- n8n, now under /n8n/ instead of the root ----------------------------
    location /n8n/ {
        proxy_pass http://127.0.0.1:5678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
    }

    # --- second-brain dashboard, under /secondbrain/ -------------------------
    location /secondbrain/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- job-tracker-mcp webhook (n8n -> job_matches) ------------------------
    location /job-tracker/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- orchestrator webhook (the agent's always-on front door) -------------
    location /agent/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
