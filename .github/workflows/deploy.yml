# Deploy to the VPS on every push to main (or manually via the Actions tab).
#
# Single consolidated job:
#   1. Builds Next.js standalone output on GitHub Actions runner.
#   2. Bundles static/public assets into standalone tarball.
#   3. Copies tarball directly over SSH to the VPS and executes remote-deploy.sh.
#   Nginx's site config is deliberately NOT touched here. It's shared with
#   n8n and edited by hand on the VPS - see DEPLOY.md.

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "orchestrator/**"
      - "mcp-servers/**"
      - "trust_layer/**"
      - "deploy/scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# Only one deploy in flight at a time - a second push landing mid-deploy
# should wait its turn, not race the first one on the same VPS.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: Build Next.js standalone app
        working-directory: dashboard
        env:
          NEXT_BASE_PATH: /secondbrain
          NEXT_PUBLIC_BASE_PATH: /secondbrain
          NEXT_PUBLIC_AUTO_EXECUTE_CONFIDENCE_THRESHOLD: "0.75"
          NEXTAUTH_SECRET: unused-at-build-time
        run: npx next build

      - name: Assemble standalone output
        working-directory: dashboard
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          tar -czf ../standalone.tar.gz -C .next standalone

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Transfer build & trigger remote deployment
        run: |
          scp -P "${{ secrets.VPS_SSH_PORT || 22 }}" standalone.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/second-brain/dashboard/standalone.tar.gz"
          ssh -p "${{ secrets.VPS_SSH_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /opt/second-brain/deploy/scripts/remote-deploy.sh'